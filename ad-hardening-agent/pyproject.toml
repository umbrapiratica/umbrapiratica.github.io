[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-hardening-agent"
version = "0.1.0"
description = "Human-in-the-loop defensive agent for Active Directory endpoint/host hardening, built on the Claude API and the ADRemedy catalog."
requires-python = ">=3.10"
dependencies = ["anthropic>=1.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
adagent = "adagent.cli:main"

[tool.setuptools]
packages = ["adagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
